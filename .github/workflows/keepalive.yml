name: PDI Keep-Alive

on:
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run keep-alive (both methods)
        env:
          PDI_URL: ${{ secrets.PDI_URL }}
          PDI_USER: ${{ secrets.PDI_USER }}
          PDI_PASS: ${{ secrets.PDI_PASS }}
          DEV_USER: ${{ secrets.DEV_USER }}
          DEV_PASS: ${{ secrets.DEV_PASS }}
        run: python main.py

      - name: Upload Method 1 proof screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-method1-pdi-${{ github.run_number }}
          path: proof/*.png
          retention-days: 3

      - name: Upload Method 2 proof screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-method2-devportal-${{ github.run_number }}
          path: proof_dev/*.png
          retention-days: 3
